[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-tailor"
version = "0.1.0"
description = "AI-tailor resumes to job descriptions and render LaTeX/PDF output."
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
pdf = ["pypdf>=4"]

[project.scripts]
resume-tailor = "tailor_resume:main"

[tool.setuptools]
py-modules = ["tailor_resume"]
